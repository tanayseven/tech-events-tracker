name: CI

# Runs on every PR: tests (incl. events_list.yaml sanity checks) and a full
# static-site build. Also dispatchable, because PRs opened by the verify-urls
# workflow use GITHUB_TOKEN, which does not fire pull_request events — that
# workflow dispatches this one on the bot branch instead.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Freeze static site
        run: uv run python app.py freeze

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: build/
          retention-days: 7
